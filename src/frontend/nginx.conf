server {
    listen      80;
    listen [::]:80;
    server_name localhost;
    root        /usr/share/nginx/html;
    index       index.html;

    # Ocultar versión de nginx en cabeceras de error
    server_tokens off;

    # Compresión gzip para reducir el tamaño de transferencia
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Assets estáticos: caché agresivo (los nombres de archivo incluyen hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: todas las rutas apuntan a index.html para que React
    # Router maneje la navegación del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de salud para orquestadores
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
